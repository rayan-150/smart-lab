{% macro map_lab(lab, x, y, width, height, radius, label_x, label_y, subtitle='', subtitle_y=0) -%}
{% set state = lab_statuses[lab] %}
<a href="{{ url_for('dashboard', lab=lab, _anchor='labs') }}" data-lab="{{ lab }}" class="lab-node"
   data-state="{{ state }}" aria-label="معمل {{ lab }}، {{ lab_labels[state] }}"{% if initial_lab == lab %} aria-current="true"{% endif %}>
    <rect class="svg-lab" x="{{ x }}" y="{{ y }}" width="{{ width }}" height="{{ height }}" rx="{{ radius }}" />
    <text x="{{ label_x }}" y="{{ label_y }}" class="svg-text-title">معمل ({{ lab }})</text>
    {% if subtitle %}<text x="{{ label_x }}" y="{{ subtitle_y }}" class="svg-text-sub">{{ subtitle }}</text>{% endif %}
</a>
{%- endmacro %}
