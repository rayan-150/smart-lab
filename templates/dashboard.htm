<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لوحة متابعة الصيانة</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f8fafc; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #cbd5e1; padding: 12px; text-align: center; }
    th { background: #0f172a; color: white; }
    .status-new { color: #dc2626; font-weight: bold; }
    .status-done { color: #16a34a; font-weight: bold; }
  </style>
</head>
<body>
  <h2>تذاكر الأعطال الحالية</h2>
  <table>
    <tr>
      <th>رقم البلاغ</th>
      <th>المعمل</th>
      <th>رقم المقعد</th>
      <th>وصف العطل</th>
      <th>الحالة</th>
      <th>القطع المستبدلة</th>
      <th>إجراء</th>
    </tr>
    {% for t in tickets %}
    <tr>
      <td>#{{ t[0] }}</td>
      <td>معمل {{ t[1] }}</td>
      <td>مقعد {{ t[2] }}</td>
      <td>{{ t[3] }}</td>
      <td class="{{ 'status-done' if t[4] == 'مكتمل' else 'status-new' }}">{{ t[4] }}</td>
      <td>{{ t[5] }}</td>
      <td>
        {% if t[4] != 'مكتمل' %}
        <form action="/resolve/{{ t[0] }}" method="POST">
          <input type="text" name="parts" placeholder="القطع المستبدلة" required>
          <button type="submit">إغلاق التذكرة</button>
        </form>
        {% else %}
        -
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
