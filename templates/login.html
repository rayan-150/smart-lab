<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - النظام الذكي لصيانة المعامل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Tajawal', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-3">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center mx-auto shadow-lg shadow-sky-500/25">
        <i class="fa-solid fa-shield-halved text-2xl text-white"></i>
      </div>
      <div>
        <h2 class="text-2xl font-black text-white">تسجيل الدخول</h2>
        <p class="text-xs text-slate-400 mt-1">النظام الذكي لإدارة ومتابعة صيانة حواسيب المعامل</p>
      </div>
    </div>

    {% if error %}
    <div class="bg-red-500/10 border border-red-500/30 text-red-400 text-xs px-4 py-3 rounded-xl flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-base"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم المستخدم</label>
        <div class="relative">
          <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500 text-sm">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" name="username" required placeholder="مثال: admin"
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl pr-10 pl-3.5 py-3 text-sm text-white focus:outline-none focus:border-sky-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">كلمة المرور</label>
        <div class="relative">
          <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500 text-sm">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" name="password" required placeholder="••••••••"
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl pr-10 pl-3.5 py-3 text-sm text-white focus:outline-none focus:border-sky-500 transition">
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-500/25 transition flex items-center justify-center gap-2 mt-2">
        <i class="fa-solid fa-right-to-bracket"></i> دخول إلى لوحة التحكم
      </button>
    </form>

    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-[11px] text-slate-400 text-center space-y-1">
      <p class="font-bold text-slate-300"><i class="fa-solid fa-circle-info ml-1 text-sky-400"></i> بيانات الدخول التجريبية المتاحة:</p>
      <p>اسم المستخدم: <span class="text-sky-400 font-mono font-bold">admin</span> | كلمة المرور: <span class="text-sky-400 font-mono font-bold">123456</span></p>
    </div>
  </div>

</body>
</html>
