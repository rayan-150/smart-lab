# Paid service and disk. For an existing service, follow README_RENDER_AR.md.
# This file is applied only when creating/syncing a Render Blueprint.
services:
  - type: web
    name: smart-lab-maintenance
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    disk:
      name: lab-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SMART_LAB_DATA_DIR
        value: /var/data/lab_databases
